name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The kit runs its own reusable gate, so a change that breaks the workflow fails here first.
  gate:
    uses: ./.github/workflows/node-ci.yml
    with:
      scripts: format:check typecheck lint test

  # The kit checks itself against its own baseline, reading the check from the commit under test.
  # A pull request's head SHA is fetchable from this repository even when the PR comes from a fork.
  baseline:
    uses: ./.github/workflows/baseline.yml
    with:
      kit-ref: ${{ github.event.pull_request.head.sha || github.sha }}
